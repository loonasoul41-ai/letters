<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мои буквы и слова</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--a:#ff8c42;--b:#4ea8de;--ok:#4caf50;--bad:#e64553;--text:#2b2b2b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Verdana,sans-serif}h1{text-align:center;color:var(--a);font-size:1.6rem}.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px}.tabs button,.trainer button,.card button{border:0;border-radius:12px;padding:9px 14px;cursor:pointer}.tabs button{background:var(--card);color:var(--text);font-weight:bold}.tabs .active,.trainer button,.card button{background:var(--a);color:#fff}.panel{display:none;max-width:850px;margin:auto;padding:10px 14px 40px}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px}.card{background:var(--card);border-radius:14px;padding:10px;text-align:center;box-shadow:0 2px 6px #0002;cursor:pointer}.letter{font-size:1.6rem;font-weight:bold;color:var(--b)}.emoji{font-size:2.4rem;margin:5px}.word{font-size:1rem}.card button{margin-top:6px}.rule{background:var(--card);border-radius:14px;margin:12px 0;box-shadow:0 2px 6px #0002;overflow:hidden}.rule-head{padding:13px;font-weight:bold;color:var(--a);cursor:pointer;display:flex;justify-content:space-between}.rule-body{display:none;padding:0 16px 16px}.rule.open .rule-body{display:block}.quiz{background:#4ea8de18;border-radius:10px;padding:10px}.quiz button{margin:4px;padding:8px;border:1px solid var(--b);border-radius:9px;background:var(--card);color:var(--text)}.trainer{text-align:center}.trainer .emoji{font-size:5rem}.trainer input{font-size:1.2rem;padding:9px;border:2px solid var(--b);border-radius:10px;text-align:center;width:190px}.feedback{font-size:1.2rem;font-weight:bold;min-height:30px;margin:10px}.ok{color:var(--ok)}.no{color:var(--bad)}.score{color:var(--b)}.speak{border:0;background:transparent;font-size:1.3rem;cursor:pointer}
</style>
</head>
<body>
<h1>🔤 Мои буквы и слова</h1>
<div class="tabs"><button class="tab active" data-panel="cards">Буквы и слова</button><button class="tab" data-panel="rules">Правила чтения</button><button class="tab" data-panel="trainer">Тренажёр</button></div>
<section class="panel active" id="cards"><div class="grid" id="cardGrid"></div></section>
<section class="panel" id="rules"><div id="rulesList"></div></section>
<section class="panel" id="trainer"><div class="trainer"><p>Посмотри на картинку и напиши слово по-английски:</p><div class="emoji" id="trEmoji"></div><button class="speak" id="listen">🔊 послушать</button><p><input id="trInput" autocomplete="off" placeholder="cat"></p><button id="check">Проверить</button><button id="next">Дальше ➜</button><div class="feedback" id="feedback"></div><div class="score" id="score">Правильно: 0 / 0</div></div></section>
<script>
// Каждая картинка специально соответствует своему английскому слову.
const words=[
 ['a','ant','🐜'],['b','bed','🛏️'],['c','cat','🐱'],['d','dog','🐶'],['e','egg','🥚'],['f','fish','🐟'],['g','goat','🐐'],['h','horse','🐴'],['i','ice cream','🍦'],['j','jam','🍓'],['k','kangaroo','🦘'],['l','lamp','💡'],['m','mouse','🐭'],['n','nose','👃'],['o','orange','🍊'],['p','pizza','🍕'],['q','queen','👑'],['r','rabbit','🐰'],['s','snake','🐍'],['t','tree','🌳'],['u','umbrella','☂️'],['v','vest','🦺'],['w','window','🪟'],['x','xylophone','🎼'],['y','yacht','⛵'],['z','zebra','🦓']
].map(([l,w,e])=>({l,w,e}));
function speak(text){try{const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.panel).classList.add('active')});
const grid=document.getElementById('cardGrid');words.forEach(item=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="letter">${item.l.toUpperCase()} ${item.l}</div><div class="emoji">${item.e}</div><div class="word">${item.w}</div><button>🔊 произнести</button>`;c.onclick=()=>speak(item.w);c.querySelector('button').onclick=e=>{e.stopPropagation();speak(item.w)};grid.append(c)});
const rules=[['Ee — две e вместе','В словах tree и green сочетание ee даёт долгий звук [и:].','Какое слово читается с [и: ]?',['egg','tree','bed'],1],['Qu — всегда вместе','Буквы qu обычно звучат как [кв]: queen, quick.','Как читается qu?',['[ку]','[кв]','[ку:]'],1],['Ou — звук [ау]','В слове mouse сочетание ou звучит как [ау].','Как прочитать mouse?',['[моусэ]','[маус]','[мосе]'],1],['G перед e, i, y','Перед e, i, y буква g часто звучит как [дж]: orange.','Где g звучит как [дж]?',['flag','glass','orange'],2],['Oo — два варианта','В zoo звук oo долгий [у:], а в book короткий [у].','Какой звук в zoo?',['долгий [у:]','короткий [у]','[о]'],0]];
const rl=document.getElementById('rulesList');rules.forEach(r=>{const d=document.createElement('div');d.className='rule';d.innerHTML=`<div class="rule-head">${r[0]}<span>▼</span></div><div class="rule-body"><p>${r[1]}</p><div class="quiz"><b>${r[2]}</b><br>${r[3].map((x,i)=>`<button data-ok="${i===r[4]}">${x}</button>`).join('')}<div class="qfb"></div></div></div>`;d.querySelector('.rule-head').onclick=()=>d.classList.toggle('open');d.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{const f=d.querySelector('.qfb');f.textContent=b.dataset.ok==='true'?'✅ Верно!':'❌ Попробуй ещё раз';f.style.color=b.dataset.ok==='true'?'var(--ok)':'var(--bad)'});rl.append(d)});
let index=0,correct=0,total=0,order=words.map((_,i)=>i);function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}shuffle(order);function load(){const x=words[order[index]];trEmoji.textContent=x.e;trInput.value='';feedback.textContent='';trInput.focus()}function check(){const x=words[order[index]],v=trInput.value.trim().toLowerCase();total++;if(v===x.w){correct++;feedback.textContent='✅ Правильно!';feedback.className='feedback ok';speak(x.w)}else{feedback.textContent='❌ Правильно: '+x.w;feedback.className='feedback no'}score.textContent=`Правильно: ${correct} / ${total}`}listen.onclick=()=>speak(words[order[index]].w);document.getElementById('check').onclick=check;document.getElementById('next').onclick=()=>{index=(index+1)%order.length;if(!index)shuffle(order);load()};trInput.onkeydown=e=>{if(e.key==='Enter')check()};load();
</script>
</body>
</html>
